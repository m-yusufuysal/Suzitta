name: Deploy Turkish Learning App to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify static app files
        run: |
          test -f singtr/index.html
          test -f singtr/styles.css
          test -f singtr/app.js
          test -f singtr/database.js

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: singtr

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
